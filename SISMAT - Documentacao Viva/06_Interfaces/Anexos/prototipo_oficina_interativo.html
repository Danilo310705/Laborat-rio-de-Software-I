<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OficinaPro - Protótipo Interativo</title>
<style>
:root{--bg:#f4f7fb;--panel:#fff;--txt:#152033;--muted:#6b778c;--line:#e5eaf1;--nav:#111c2d;--accent:#d62828;--green:#16a34a;--blue:#2563eb;--amber:#d97706;--r:14px;--sh:0 12px 30px #14203312}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--txt)}button,input,select,textarea{font:inherit}.hidden{display:none!important}
.login{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}.hero{background:linear-gradient(135deg,#0f1a2d,#1d304c);color:#fff;padding:70px;display:flex;align-items:center}.hero h1{font-size:48px;margin:16px 0}.hero span{color:#ef4444}.hero p{color:#d7e0ed;font-size:18px;max-width:540px;line-height:1.5}.loginwrap{display:grid;place-items:center;padding:32px}.logincard{width:min(420px,100%);background:#fff;border-radius:20px;padding:34px;box-shadow:var(--sh)}
.field{display:flex;flex-direction:column;gap:7px;margin:13px 0}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:#eef2f7;color:#26354d}.success{background:var(--green);color:#fff}.danger{background:#fee2e2;color:#b91c1c}.ghost{background:#fff;border:1px solid var(--line)}.full{width:100%}
.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.side{background:linear-gradient(#111c2d,#0b1422);color:#dce6f5;padding:16px 13px;display:flex;flex-direction:column;height:100vh;position:sticky;top:0}.logo{font-weight:800;font-size:21px;padding:12px 9px 22px}.logo span{color:#ef4444}.nav{display:flex;flex-direction:column;gap:5px}.nav button{border:0;background:transparent;color:#c9d4e5;text-align:left;padding:10px 11px;border-radius:9px;cursor:pointer}.nav button.active,.nav button:hover{background:#263954;color:#fff}.logout{margin-top:auto}
.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 24px;position:sticky;top:0;z-index:10}.search{width:min(430px,45vw);border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#f8fafc}.avatar{width:34px;height:34px;border-radius:50%;background:#dbeafe;color:#1d4ed8;display:grid;place-items:center;font-weight:800}
.main{min-width:0}.content{padding:26px}.page{display:none}.page.active{display:block}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:18px}.head h1{margin:0;font-size:28px}.head p{margin:5px 0 0;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}.metric small{color:var(--muted)}.metric b{display:block;font-size:30px;margin-top:7px}.grid2{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:13px}.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff}.toolbar input{min-width:260px}
.table{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}.table table{border-collapse:collapse;width:100%;min-width:680px}th,td{padding:11px 12px;border-bottom:1px solid #edf1f6;text-align:left;font-size:14px}th{background:#f8fafc;color:#526077;font-size:12px;text-transform:uppercase}tr:last-child td{border-bottom:0}
.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:700}.open{background:#fee2e2;color:#b91c1c}.progress{background:#dbeafe;color:#1d4ed8}.done{background:#dcfce7;color:#166534}.cancel{background:#e5e7eb;color:#4b5563}.warn{background:#fef3c7;color:#92400e}
.actions{display:flex;gap:6px;flex-wrap:wrap}.mini{padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer}.info{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}.detailgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:17px}.tabs{display:flex;gap:3px;border-bottom:1px solid var(--line);margin-bottom:14px}.tab{border:0;background:transparent;padding:10px 13px;font-weight:700;color:#667085;border-bottom:2px solid transparent;cursor:pointer}.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.modalbg{position:fixed;inset:0;background:#0f172a90;display:grid;place-items:center;padding:20px;z-index:100}.modal{width:min(760px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;box-shadow:0 30px 80px #0004}.mh{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.mb{padding:20px}.mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.span2{grid-column:1/-1}
.alert{padding:11px 12px;background:#fff7f7;border:1px solid #fecaca;border-radius:10px;margin:8px 0;display:flex;justify-content:space-between}.total{display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);font-weight:800}.pricebox{background:#fff7dd;border:1px solid #fde68a;border-radius:10px;padding:13px;display:flex;justify-content:space-between;font-weight:800}.toast{position:fixed;right:24px;bottom:24px;background:#111827;color:#fff;padding:12px 16px;border-radius:10px;opacity:0;transform:translateY(10px);transition:.2s;z-index:200}.toast.show{opacity:1;transform:none}
.receipt{background:#fff;padding:24px}.rhead{display:flex;justify-content:space-between;border-bottom:2px solid #111827;padding-bottom:12px;margin-bottom:16px}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.app{grid-template-columns:82px 1fr}.nav button{font-size:0;text-align:center}.nav button::first-letter{font-size:20px}.logo{font-size:0}.logo:after{content:"🔧";font-size:26px}.detailgrid{grid-template-columns:1fr}}
@media(max-width:700px){.login{grid-template-columns:1fr}.hero{display:none}.cards{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.span2{grid-column:auto}.content{padding:15px}.search{display:none}}
@media print{body *{visibility:hidden!important}#printArea,#printArea *{visibility:visible!important}#printArea{position:absolute;left:0;top:0;width:100%}}
</style>
</head>
<body>
<div id="toast" class="toast"></div>

<section id="login" class="login">
  <div class="hero"><div><div class="logo" style="font-size:28px;padding:0">🔧 Oficina<span>Pro</span></div><h1>Gestão de oficina<br>sem complicação.</h1><p>Protótipo navegável baseado nos seus casos de uso, regras de negócio e modelo de dados.</p></div></div>
  <div class="loginwrap"><div class="logincard"><h2>Bem-vindo</h2><p style="color:var(--muted)">Entre para acessar o sistema.</p><div class="field"><label>E-mail</label><input id="email" value="admin@oficinapro.com"></div><div class="field"><label>Senha</label><input id="senha" type="password" value="123456"></div><button class="btn primary full" onclick="enter()">Entrar</button><p style="font-size:12px;color:var(--muted);margin-top:14px">Demonstração: qualquer e-mail e senha preenchidos permitem o acesso.</p></div></div>
</section>

<section id="app" class="app hidden">
  <aside class="side"><div class="logo">🔧 Oficina<span>Pro</span></div><div class="nav">
    <button data-p="home" class="active">🏠 Início</button><button data-p="clients">👥 Clientes</button><button data-p="orders">📋 Ordens de Serviço</button><button data-p="products">📦 Produtos</button><button data-p="services">🛠️ Serviços</button><button data-p="techs">👨‍🔧 Técnicos</button><button data-p="suppliers">🚚 Fornecedores</button><button data-p="stock">📥 Estoque</button>
  </div><div class="logout"><button class="btn secondary full" onclick="leave()">Sair</button></div></aside>
  <main class="main"><header class="top"><input class="search" placeholder="Pesquisar no sistema..." oninput="globalFind(this.value)"><div style="display:flex;gap:10px;align-items:center"><div class="avatar">JS</div><div><b>João Silva</b><div style="font-size:12px;color:var(--muted)">Usuário</div></div></div></header>
  <div class="content"><section id="p-home" class="page active"></section><section id="p-clients" class="page"></section><section id="p-orders" class="page"></section><section id="p-detail" class="page"></section><section id="p-products" class="page"></section><section id="p-services" class="page"></section><section id="p-techs" class="page"></section><section id="p-suppliers" class="page"></section><section id="p-stock" class="page"></section></div></main>
</section>
<div id="modal"></div>

<script>
const base={
clients:[{id:1,name:"Carlos Pereira",type:"PF",doc:"987.654.321-00",phone:"(45) 97777-3333",email:"carlos@email.com",address:"Rua das Flores, 120"},{id:2,name:"Ana Souza Autopeças",type:"PJ",doc:"45.678.901/0001-11",phone:"(45) 96666-4444",email:"contato@anasouza.com",address:"Av. Paraná, 450"},{id:3,name:"João da Silva",type:"PF",doc:"123.456.789-00",phone:"(45) 99999-1111",email:"joao@email.com",address:"Rua XV de Novembro, 99"}],
vehicles:[{id:1,clientId:1,plate:"ABC1D23",brand:"Honda",model:"Civic",year:2020},{id:2,clientId:2,plate:"DEF4G56",brand:"Fiat",model:"Argo",year:2022},{id:3,clientId:3,plate:"XYZ9A87",brand:"Honda",model:"CG 160",year:2024}],
techs:[{id:1,name:"Carlos Mendes",phone:"(45) 98888-1010",active:true},{id:2,name:"Marcos Silva",phone:"(45) 97777-2020",active:true},{id:3,name:"Pedro Nunes",phone:"(45) 96666-3030",active:false}],
services:[{id:1,name:"Troca de óleo",value:120,time:45},{id:2,name:"Revisão dos freios",value:180,time:90},{id:3,name:"Alinhamento",value:100,time:60}],
products:[{id:1,code:"OLEO5W30",name:"Óleo 5W30",unit:"UN",cost:30,sale:40,stock:3,min:5},{id:2,code:"FILTRO01",name:"Filtro de óleo",unit:"UN",cost:18,sale:30,stock:2,min:5},{id:3,code:"PASTFREIO",name:"Pastilha de freio",unit:"JG",cost:95,sale:150,stock:4,min:10},{id:4,code:"VELA01",name:"Vela de ignição",unit:"UN",cost:20,sale:35,stock:12,min:8}],
suppliers:[{id:1,name:"Distribuidora Oeste",doc:"12.345.678/0001-90",phone:"(45) 3333-1234",products:[1,2,4]},{id:2,name:"Auto Parts Paraná",doc:"98.765.432/0001-10",phone:"(45) 3333-9876",products:[3]}],
entries:[],
orders:[{id:128,clientId:1,vehicleId:1,problem:"Barulho ao frear.",diagnosis:"Discos e pastilhas desgastados.",status:"Em andamento",opened:"26/09/2026 10:30",products:[{productId:3,qty:1,unit:150},{productId:1,qty:4,unit:40}],services:[{serviceId:1,techId:1,value:80},{serviceId:2,techId:2,value:180}],payment:null},{id:127,clientId:2,vehicleId:2,problem:"Revisão preventiva.",diagnosis:"",status:"Aberta",opened:"26/09/2026 09:10",products:[],services:[],payment:null},{id:126,clientId:3,vehicleId:3,problem:"Motor falhando.",diagnosis:"Vela desgastada.",status:"Concluída",opened:"25/09/2026 15:20",products:[{productId:4,qty:1,unit:35}],services:[{serviceId:3,techId:1,value:100}],payment:{method:"PIX",discount:0,final:135}}]
};
const cp=x=>JSON.parse(JSON.stringify(x));let s;try{s=JSON.parse(localStorage.oficinaPro)||cp(base)}catch(e){s=cp(base)}
let orderId=null,tab="products";
const $=id=>document.getElementById(id),money=v=>Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}),next=a=>a.length?Math.max(...a.map(x=>x.id))+1:1,esc=x=>String(x??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function save(){localStorage.oficinaPro=JSON.stringify(s);renderAll()}function notify(t){toast.textContent=t;toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),2200)}
function enter(){if(!email.value||!senha.value)return notify("Preencha e-mail e senha.");login.classList.add("hidden");app.classList.remove("hidden");renderAll()}function leave(){app.classList.add("hidden");login.classList.remove("hidden")}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>show(b.dataset.p));
function show(p){document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("active",x.dataset.p===p));$("p-"+p).classList.add("active");renderAll()}
function badge(st){let c=st==="Aberta"?"open":st==="Em andamento"?"progress":st==="Concluída"?"done":"cancel";return `<span class="badge ${c}">${st}</span>`}
function total(o){return o.products.reduce((a,i)=>a+i.qty*i.unit,0)+o.services.reduce((a,i)=>a+Number(i.value),0)}
function low(){return s.products.filter(p=>p.stock<=p.min)}
function ordersTable(arr,act=true){return `<div class="table"><table><thead><tr><th>#</th><th>Cliente</th><th>Veículo</th><th>Placa</th><th>Status</th><th>Total</th>${act?"<th>Ação</th>":""}</tr></thead><tbody>${arr.map(o=>{let c=s.clients.find(x=>x.id===o.clientId)||{},v=s.vehicles.find(x=>x.id===o.vehicleId)||{};return `<tr><td>#${String(o.id).padStart(6,"0")}</td><td>${esc(c.name)}</td><td>${esc((v.brand||"")+" "+(v.model||""))}</td><td>${esc(v.plate)}</td><td>${badge(o.status)}</td><td>${money(o.payment?.final??total(o))}</td>${act?`<td><button class="mini" onclick="openOrder(${o.id})">👁️ Abrir</button></td>`:""}</tr>`}).join("")}</tbody></table></div>`}
function renderHome(){$("p-home").innerHTML=`<div class="head"><div><h1>Olá, João 👋</h1><p>Resumo da oficina.</p></div><button class="btn ghost" onclick="reset()">↻ Restaurar demo</button></div><div class="cards">${metric("O.S. abertas",s.orders.filter(o=>o.status==="Aberta").length)}${metric("Em andamento",s.orders.filter(o=>o.status==="Em andamento").length)}${metric("Concluídas",s.orders.filter(o=>o.status==="Concluída").length)}${metric("Estoque mínimo",low().length)}</div><div class="grid2"><div class="card"><div class="head"><h3>Últimas O.S.</h3><button class="btn ghost" onclick="show('orders')">Ver todas</button></div>${ordersTable([...s.orders].sort((a,b)=>b.id-a.id).slice(0,5),false)}</div><div class="card"><h3>Alertas de estoque</h3>${low().map(p=>`<div class="alert"><div><b>${esc(p.name)}</b><div style="font-size:12px">${p.stock} ${p.unit} disponíveis</div></div><span class="badge warn">mín. ${p.min}</span></div>`).join("")||"<p>Sem alertas.</p>"}</div></div>`}
function metric(t,n){return `<div class="card metric"><small>${t}</small><b>${n}</b></div>`}
function renderClients(q=""){let a=s.clients.filter(c=>[c.name,c.doc,c.phone].some(v=>v.toLowerCase().includes(q.toLowerCase())));$("p-clients").innerHTML=`<div class="head"><div><h1>Clientes</h1><p>Cadastre e consulte clientes.</p></div><button class="btn primary" onclick="clientModal()">+ Novo Cliente</button></div><div class="toolbar"><input placeholder="Nome, CPF/CNPJ ou telefone..." value="${esc(q)}" oninput="renderClients(this.value)"></div><div class="table"><table><thead><tr><th>Nome</th><th>CPF/CNPJ</th><th>Telefone</th><th>Tipo</th><th>Ações</th></tr></thead><tbody>${a.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.doc)}</td><td>${esc(c.phone)}</td><td>${c.type}</td><td><button class="mini" onclick="clientModal(${c.id})">✏️ Editar</button></td></tr>`).join("")}</tbody></table></div>`}
function clientModal(id){let c=id?s.clients.find(x=>x.id===id):{name:"",type:"PF",doc:"",phone:"",email:"",address:""};openModal(id?"Editar Cliente":"Cadastrar Cliente",`<div class="formgrid"><div class="field"><label>Tipo</label><select id="ct"><option ${c.type==="PF"?"selected":""}>PF</option><option ${c.type==="PJ"?"selected":""}>PJ</option></select></div><div class="field"><label>Nome / Razão social</label><input id="cn" value="${esc(c.name)}"></div><div class="field"><label>CPF/CNPJ</label><input id="cd" value="${esc(c.doc)}"></div><div class="field"><label>Telefone</label><input id="cp" value="${esc(c.phone)}"></div><div class="field"><label>E-mail</label><input id="ce" value="${esc(c.email)}"></div><div class="field"><label>Endereço</label><input id="ca" value="${esc(c.address)}"></div></div>`,()=>{if(!cn.value||!cd.value||!cp.value)return notify("Preencha os campos obrigatórios.");let o={id:id||next(s.clients),name:cn.value,type:ct.value,doc:cd.value,phone:cp.value,email:ce.value,address:ca.value};if(id)s.clients[s.clients.findIndex(x=>x.id===id)]=o;else s.clients.push(o);save();closeModal();notify("Cadastrado com sucesso.");show("clients")})}
function renderOrders(q="",st="Todos"){let a=s.orders.filter(o=>{let c=s.clients.find(x=>x.id===o.clientId)||{},v=s.vehicles.find(x=>x.id===o.vehicleId)||{};return [o.id,c.name,v.plate,o.status].some(z=>String(z).toLowerCase().includes(q.toLowerCase()))});if(st!=="Todos")a=a.filter(o=>o.status===st);$("p-orders").innerHTML=`<div class="head"><div><h1>Ordens de Serviço</h1><p>Cadastre e acompanhe os atendimentos.</p></div><button class="btn primary" onclick="newOrder()">+ Nova O.S.</button></div><div class="toolbar"><input placeholder="Número, cliente ou placa..." value="${esc(q)}" oninput="renderOrders(this.value,$('st').value)"><select id="st" onchange="renderOrders(document.querySelector('#p-orders input').value,this.value)"><option>Todos</option>${["Aberta","Em andamento","Concluída","Cancelada"].map(x=>`<option ${x===st?"selected":""}>${x}</option>`).join("")}</select></div>${ordersTable(a)}`}
function newOrder(){openModal("Nova Ordem de Serviço",`<div class="formgrid"><div class="field span2"><label>Cliente</label><select id="oc"><option value="">Selecione...</option>${s.clients.map(c=>`<option value="${c.id}">${esc(c.name)} — ${esc(c.doc)}</option>`).join("")}</select></div><div class="field"><label>Placa</label><input id="op" onblur="lookupV()"></div><div class="field"><label>Veículo</label><input id="ovi" disabled placeholder="Digite a placa"></div><div id="nv" class="span2 hidden"><div class="formgrid"><div class="field"><label>Marca</label><input id="ob"></div><div class="field"><label>Modelo</label><input id="om"></div><div class="field"><label>Ano</label><input id="oy" type="number"></div></div></div><div class="field span2"><label>Problema relatado</label><textarea id="opr"></textarea></div></div>`,createOrder)}
function lookupV(){let p=op.value.trim().toUpperCase(),v=s.vehicles.find(x=>x.plate===p);if(v){let c=s.clients.find(x=>x.id===v.clientId);ovi.value=`${v.brand} ${v.model} ${v.year} — ${c.name}`;op.dataset.vid=v.id;nv.classList.add("hidden")}else{ovi.value="Veículo não cadastrado";delete op.dataset.vid;nv.classList.remove("hidden")}}
function createOrder(){let cid=Number(oc.value);if(!cid||!op.value||!opr.value)return notify("Preencha os campos obrigatórios.");let vid=Number(op.dataset.vid||0);if(vid){let v=s.vehicles.find(x=>x.id===vid);if(v.clientId!==cid)return notify("O veículo informado está vinculado a outro cliente.")}else{if(!ob.value||!om.value||!oy.value)return notify("Preencha os dados do novo veículo.");vid=next(s.vehicles);s.vehicles.push({id:vid,clientId:cid,plate:op.value.toUpperCase(),brand:ob.value,model:om.value,year:Number(oy.value)})}let o={id:next(s.orders),clientId:cid,vehicleId:vid,problem:opr.value,diagnosis:"",status:"Aberta",opened:new Date().toLocaleString("pt-BR"),products:[],services:[],payment:null};s.orders.push(o);save();closeModal();notify("Ordem de serviço aberta com sucesso.");openOrder(o.id)}
function openOrder(id){orderId=id;tab="products";document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));$("p-detail").classList.add("active");document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));renderDetail()}
function renderDetail(){let o=s.orders.find(x=>x.id===orderId),c=s.clients.find(x=>x.id===o.clientId)||{},v=s.vehicles.find(x=>x.id===o.vehicleId)||{},lock=["Concluída","Cancelada"].includes(o.status);$("p-detail").innerHTML=`<div class="head"><div><button class="btn ghost" onclick="show('orders')">← Voltar</button><h1 style="margin-top:10px">O.S. #${String(o.id).padStart(6,"0")} ${badge(o.status)}</h1></div><div class="actions">${!lock?`<button class="btn ghost" onclick="statusModal()">Alterar Status</button>`:""}${o.status==="Em andamento"?`<button class="btn success" onclick="finishModal()">Finalizar O.S.</button>`:""}<button class="btn ghost" onclick="receipt()">Emitir comprovante</button></div></div><div class="detailgrid"><div class="info"><small>CLIENTE</small><h3>${esc(c.name)}</h3><div>${esc(c.doc)}</div><div>${esc(c.phone)}</div></div><div class="info"><small>VEÍCULO</small><h3>${esc(v.brand+" "+v.model)}</h3><div>${esc(v.plate)} — ${v.year}</div></div><div class="info"><small>PROBLEMA</small><p>${esc(o.problem)}</p></div></div><div class="card"><div class="tabs">${["products","services","diagnosis","summary"].map(x=>`<button class="tab ${tab===x?"active":""}" onclick="tab='${x}';renderTab()">${{products:"Produtos",services:"Serviços",diagnosis:"Diagnóstico",summary:"Resumo"}[x]}</button>`).join("")}</div><div id="tabbox"></div></div>`;renderTab()}
function renderTab(){let o=s.orders.find(x=>x.id===orderId),lock=["Concluída","Cancelada"].includes(o.status),b=$("tabbox");if(tab==="products"){b.innerHTML=`<div class="head"><h3>Produtos utilizados</h3>${!lock?`<button class="btn primary" onclick="opModal()">+ Adicionar Produto</button>`:""}</div><div class="table"><table><thead><tr><th>Produto</th><th>Qtd.</th><th>Valor unit.</th><th>Subtotal</th><th>Ações</th></tr></thead><tbody>${o.products.map((i,k)=>{let p=s.products.find(x=>x.id===i.productId)||{};return `<tr><td>${esc(p.name)}</td><td>${i.qty}</td><td>${money(i.unit)}</td><td>${money(i.qty*i.unit)}</td><td>${lock?"-":`<button class="mini" onclick="opModal(${k})">✏️</button> <button class="mini" onclick="rmProd(${k})">🗑️</button>`}</td></tr>`}).join("")||'<tr><td colspan="5">Nenhum produto.</td></tr>'}</tbody></table></div><div class="total"><span>Total produtos</span><span>${money(o.products.reduce((a,i)=>a+i.qty*i.unit,0))}</span></div>`}if(tab==="services"){b.innerHTML=`<div class="head"><h3>Serviços</h3>${!lock?`<button class="btn primary" onclick="osModal()">+ Adicionar Serviço</button>`:""}</div><div class="table"><table><thead><tr><th>Serviço</th><th>Técnico</th><th>Valor</th><th>Ações</th></tr></thead><tbody>${o.services.map((i,k)=>{let sv=s.services.find(x=>x.id===i.serviceId)||{},t=s.techs.find(x=>x.id===i.techId)||{};return `<tr><td>${esc(sv.name)}</td><td>${esc(t.name)}</td><td>${money(i.value)}</td><td>${lock?"-":`<button class="mini" onclick="osModal(${k})">✏️</button> <button class="mini" onclick="rmServ(${k})">🗑️</button>`}</td></tr>`}).join("")||'<tr><td colspan="4">Nenhum serviço.</td></tr>'}</tbody></table></div>`}if(tab==="diagnosis"){b.innerHTML=`<div class="field"><label>Problema relatado</label><textarea disabled>${esc(o.problem)}</textarea></div><div class="field"><label>Diagnóstico técnico</label><textarea id="diag" ${lock?"disabled":""}>${esc(o.diagnosis)}</textarea></div>${!lock?`<button class="btn primary" onclick="o.diagnosis=diag.value;save();notify('Diagnóstico salvo.');renderDetail()">Salvar diagnóstico</button>`:""}`;window.o=o}if(tab==="summary"){b.innerHTML=`<div class="grid2"><div><div class="total"><span>Produtos</span><span>${money(o.products.reduce((a,i)=>a+i.qty*i.unit,0))}</span></div><div class="total"><span>Serviços</span><span>${money(o.services.reduce((a,i)=>a+Number(i.value),0))}</span></div><div class="pricebox"><span>Total</span><span>${money(total(o))}</span></div></div><div class="info">${badge(o.status)}<p>${o.payment?`Pagamento: <b>${o.payment.method}</b><br>Desconto: <b>${money(o.payment.discount)}</b><br>Total pago: <b>${money(o.payment.final)}</b>`:"Pagamento ainda não registrado."}</p></div></div>`}}
function opModal(k=null){let o=s.orders.find(x=>x.id===orderId),i=k!==null?o.products[k]:null;openModal(k!==null?"Editar Produto":"Adicionar Produto",`<div class="formgrid"><div class="field span2"><label>Produto</label><select id="pp" ${k!==null?"disabled":""}><option value="">Selecione...</option>${s.products.map(p=>`<option value="${p.id}" ${i&&i.productId===p.id?"selected":""}>${esc(p.name)} — estoque ${p.stock} — ${money(p.sale)}</option>`).join("")}</select></div><div class="field"><label>Quantidade</label><input id="pq" type="number" min="1" value="${i?i.qty:1}"></div></div>`,()=>{let pid=Number(pp.value),q=Number(pq.value);if(!pid||q<=0)return notify("O valor informado deve ser maior que zero.");let p=s.products.find(x=>x.id===pid);if(k===null){if(q>p.stock)return notify("A quantidade excede o estoque disponível.");p.stock-=q;o.products.push({productId:pid,qty:q,unit:p.sale})}else{let old=o.products[k],prod=s.products.find(x=>x.id===old.productId),d=q-old.qty;if(d>0&&d>prod.stock)return notify("A quantidade excede o estoque disponível.");prod.stock-=d;old.qty=q}save();closeModal();renderDetail();notify("Alteração realizada.")})}
function rmProd(k){let o=s.orders.find(x=>x.id===orderId);if(!confirm("Remover produto?"))return;let i=o.products[k],p=s.products.find(x=>x.id===i.productId);p.stock+=i.qty;o.products.splice(k,1);save();renderDetail();notify("Produto removido.")}
function osModal(k=null){let o=s.orders.find(x=>x.id===orderId),i=k!==null?o.services[k]:null;openModal(k!==null?"Editar Serviço":"Adicionar Serviço",`<div class="formgrid"><div class="field span2"><label>Serviço</label><select id="ss" ${k!==null?"disabled":""} onchange="let z=s.services.find(x=>x.id===Number(this.value));if(z&&!sv.value)sv.value=z.value"><option value="">Selecione...</option>${s.services.map(x=>`<option value="${x.id}" ${i&&i.serviceId===x.id?"selected":""}>${esc(x.name)} — padrão ${money(x.value)}</option>`).join("")}</select></div><div class="field"><label>Técnico</label><select id="tt"><option value="">Selecione...</option>${s.techs.filter(t=>t.active).map(t=>`<option value="${t.id}" ${i&&i.techId===t.id?"selected":""}>${esc(t.name)}</option>`).join("")}</select></div><div class="field"><label>Valor cobrado</label><input id="sv" type="number" step="0.01" min="0" value="${i?i.value:""}"></div></div>`,()=>{let sid=Number(ss.value),tid=Number(tt.value),v=Number(sv.value);if(!sid||!tid)return notify("Selecione serviço e técnico.");if(v<0)return notify("Valor inválido.");if(k===null)o.services.push({serviceId:sid,techId:tid,value:v});else Object.assign(o.services[k],{techId:tid,value:v});save();closeModal();renderDetail();notify("Serviço salvo.")})}
function rmServ(k){let o=s.orders.find(x=>x.id===orderId);if(!confirm("Remover serviço?"))return;o.services.splice(k,1);save();renderDetail();notify("Serviço removido.")}
function statusModal(){let o=s.orders.find(x=>x.id===orderId),opts=o.status==="Aberta"?["Em andamento","Cancelada"]:o.status==="Em andamento"?["Cancelada"]:[];if(!opts.length)return notify("Sem transições disponíveis.");openModal("Alterar Status",`<div class="field"><label>Novo status</label><select id="ns">${opts.map(x=>`<option>${x}</option>`).join("")}</select></div>`,()=>{o.status=ns.value;save();closeModal();renderDetail();notify("Status atualizado.")})}
function finishModal(){let o=s.orders.find(x=>x.id===orderId);openModal("Finalizar O.S.",`<div class="total"><span>Subtotal</span><span>${money(total(o))}</span></div><div class="field"><label>Tipo de desconto</label><select id="dt" onchange="recalc()"><option value="none">Sem desconto</option><option value="percent">Percentual</option><option value="value">Valor</option></select></div><div class="field"><label>Desconto</label><input id="dv" type="number" value="0" min="0" step="0.01" oninput="recalc()"></div><div class="field"><label>Forma de pagamento</label><select id="pm"><option value="">Selecione...</option><option>PIX</option><option>Dinheiro</option><option>Cartão de débito</option><option>Cartão de crédito</option></select></div><div class="pricebox"><span>Valor final</span><span id="fv">${money(total(o))}</span></div>`,()=>{if(!pm.value)return notify("Selecione uma forma de pagamento.");let t=total(o),raw=Number(dv.value||0),d=dt.value==="percent"?t*raw/100:dt.value==="value"?raw:0;if(d>t)return notify("Desconto maior que o total.");o.payment={method:pm.value,discount:d,final:t-d};o.status="Concluída";save();closeModal();renderDetail();notify("O.S. finalizada com sucesso.")},"Finalizar O.S.");window.recalc=()=>{let t=total(o),raw=Number(dv.value||0),d=dt.value==="percent"?t*raw/100:dt.value==="value"?raw:0;fv.textContent=money(Math.max(0,t-d))}}
function receipt(){let o=s.orders.find(x=>x.id===orderId),c=s.clients.find(x=>x.id===o.clientId)||{},v=s.vehicles.find(x=>x.id===o.vehicleId)||{};openModal("Comprovante",`<div id="printArea" class="receipt"><div class="rhead"><div><h2>🔧 Oficina<span style="color:#d62828">Pro</span></h2><small>Comprovante de Ordem de Serviço</small></div><div><b>O.S. #${String(o.id).padStart(6,"0")}</b><br>${badge(o.status)}</div></div><div class="grid2"><div><b>Cliente</b><br>${esc(c.name)}<br>${esc(c.doc)}<br>${esc(c.phone)}</div><div><b>Veículo</b><br>${esc(v.brand+" "+v.model)} — ${v.year}<br>Placa: ${esc(v.plate)}</div></div><p><b>Problema:</b> ${esc(o.problem)}</p><p><b>Diagnóstico:</b> ${esc(o.diagnosis||"Não informado")}</p><div class="total"><span>Subtotal</span><span>${money(total(o))}</span></div>${o.payment?`<div class="total"><span>Desconto</span><span>${money(o.payment.discount)}</span></div><div class="total"><span>Pagamento</span><span>${esc(o.payment.method)}</span></div><div class="pricebox"><span>Total pago</span><span>${money(o.payment.final)}</span></div>`:""}</div>`,()=>window.print(),"Imprimir / Salvar PDF")}
function renderProducts(){ $("p-products").innerHTML=`<div class="head"><div><h1>Produtos</h1><p>Catálogo e estoque.</p></div><button class="btn primary" onclick="prodModal()">+ Novo Produto</button></div><div class="table"><table><thead><tr><th>Código</th><th>Produto</th><th>Custo</th><th>Venda</th><th>Estoque</th><th>Mínimo</th></tr></thead><tbody>${s.products.map(p=>`<tr><td>${esc(p.code)}</td><td>${esc(p.name)}</td><td>${money(p.cost)}</td><td>${money(p.sale)}</td><td>${p.stock<=p.min?`<span class="badge warn">${p.stock}</span>`:p.stock}</td><td>${p.min}</td></tr>`).join("")}</tbody></table></div>`}
function prodModal(){openModal("Cadastrar Produto",`<div class="formgrid"><div class="field"><label>Código</label><input id="pc"></div><div class="field"><label>Nome</label><input id="pn"></div><div class="field"><label>Unidade</label><select id="pu"><option>UN</option><option>L</option><option>KG</option><option>CX</option></select></div><div class="field"><label>Estoque mínimo</label><input id="pmin" type="number" value="0"></div><div class="field"><label>Custo</label><input id="pco" type="number" step="0.01"></div><div class="field"><label>Venda</label><input id="pve" type="number" step="0.01"></div></div>`,()=>{if(!pc.value||!pn.value)return notify("Preencha os campos obrigatórios.");s.products.push({id:next(s.products),code:pc.value,name:pn.value,unit:pu.value,cost:Number(pco.value),sale:Number(pve.value),stock:0,min:Number(pmin.value)});save();closeModal();show("products");notify("Produto cadastrado.")})}
function renderServices(){ $("p-services").innerHTML=`<div class="head"><div><h1>Serviços</h1><p>Catálogo de serviços.</p></div><button class="btn primary" onclick="servModal()">+ Novo Serviço</button></div><div class="table"><table><thead><tr><th>Descrição</th><th>Valor padrão</th><th>Tempo estimado</th></tr></thead><tbody>${s.services.map(x=>`<tr><td>${esc(x.name)}</td><td>${money(x.value)}</td><td>${x.time} min</td></tr>`).join("")}</tbody></table></div>`}
function servModal(){openModal("Cadastrar Serviço",`<div class="formgrid"><div class="field span2"><label>Descrição</label><input id="sn"></div><div class="field"><label>Valor padrão</label><input id="sva" type="number" step="0.01"></div><div class="field"><label>Tempo estimado (min)</label><input id="stm" type="number" min="1"></div></div>`,()=>{if(!sn.value||Number(stm.value)<=0)return notify("Preencha corretamente.");s.services.push({id:next(s.services),name:sn.value,value:Number(sva.value),time:Number(stm.value)});save();closeModal();show("services");notify("Serviço cadastrado.")})}
function renderTechs(){ $("p-techs").innerHTML=`<div class="head"><div><h1>Técnicos</h1><p>Profissionais responsáveis pelos serviços.</p></div><button class="btn primary" onclick="techModal()">+ Novo Técnico</button></div><div class="table"><table><thead><tr><th>Nome</th><th>Telefone</th><th>Situação</th><th>Ação</th></tr></thead><tbody>${s.techs.map(t=>`<tr><td>${esc(t.name)}</td><td>${esc(t.phone)}</td><td>${t.active?'<span class="badge done">Ativo</span>':'<span class="badge cancel">Inativo</span>'}</td><td><button class="mini" onclick="t=s.techs.find(x=>x.id===${t.id});t.active=!t.active;save();renderTechs()">${t.active?"Inativar":"Ativar"}</button></td></tr>`).join("")}</tbody></table></div>`}
function techModal(){openModal("Cadastrar Técnico",`<div class="formgrid"><div class="field"><label>Nome</label><input id="tn"></div><div class="field"><label>Telefone</label><input id="tph"></div></div>`,()=>{if(!tn.value)return notify("Preencha o nome.");s.techs.push({id:next(s.techs),name:tn.value,phone:tph.value,active:true});save();closeModal();show("techs");notify("Técnico cadastrado.")})}
function renderSuppliers(){ $("p-suppliers").innerHTML=`<div class="head"><div><h1>Fornecedores</h1><p>Fornecedores e produtos vinculados.</p></div><button class="btn primary" onclick="supModal()">+ Novo Fornecedor</button></div><div class="table"><table><thead><tr><th>Fornecedor</th><th>CPF/CNPJ</th><th>Telefone</th><th>Produtos</th></tr></thead><tbody>${s.suppliers.map(f=>`<tr><td>${esc(f.name)}</td><td>${esc(f.doc)}</td><td>${esc(f.phone)}</td><td>${f.products.map(id=>esc(s.products.find(p=>p.id===id)?.name||"")).join(", ")}</td></tr>`).join("")}</tbody></table></div>`}
function supModal(){openModal("Cadastrar Fornecedor",`<div class="formgrid"><div class="field"><label>Nome</label><input id="fn"></div><div class="field"><label>CPF/CNPJ</label><input id="fd"></div><div class="field"><label>Telefone</label><input id="fp"></div><div class="field span2"><label>Produtos fornecidos</label><select id="fpr" multiple size="5">${s.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select></div></div>`,()=>{if(!fn.value||!fd.value)return notify("Preencha os campos obrigatórios.");s.suppliers.push({id:next(s.suppliers),name:fn.value,doc:fd.value,phone:fp.value,products:[...fpr.selectedOptions].map(o=>Number(o.value))});save();closeModal();show("suppliers");notify("Fornecedor cadastrado.")})}
function renderStock(){ $("p-stock").innerHTML=`<div class="head"><div><h1>Estoque</h1><p>Entradas e alertas de estoque mínimo.</p></div><button class="btn primary" onclick="entryModal()">+ Registrar Entrada</button></div><div class="grid2"><div class="card"><h3>Posição de estoque</h3><div class="table"><table><thead><tr><th>Produto</th><th>Estoque</th><th>Mínimo</th><th>Situação</th></tr></thead><tbody>${s.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.stock} ${p.unit}</td><td>${p.min}</td><td>${p.stock<=p.min?'<span class="badge warn">Atenção</span>':'<span class="badge done">Normal</span>'}</td></tr>`).join("")}</tbody></table></div></div><div class="card"><h3>Alertas</h3>${low().map(p=>`<div class="alert"><b>${esc(p.name)}</b><span class="badge warn">${p.stock}/${p.min}</span></div>`).join("")||"<p>Sem alertas.</p>"}</div></div>`}
function entryModal(){openModal("Registrar Entrada de Mercadoria",`<div class="formgrid"><div class="field span2"><label>Fornecedor</label><select id="ef"><option value="">Selecione...</option>${s.suppliers.map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join("")}</select></div><div class="field"><label>Produto</label><select id="ep"><option value="">Selecione...</option>${s.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select></div><div class="field"><label>Quantidade</label><input id="eq" type="number" min="1"></div><div class="field span2"><label>Valor de compra</label><input id="ev" type="number" step="0.01" min="0"></div></div>`,()=>{let pid=Number(ep.value),q=Number(eq.value);if(!ef.value||!pid||q<=0)return notify("Preencha corretamente.");s.products.find(p=>p.id===pid).stock+=q;s.entries.push({id:next(s.entries),supplierId:Number(ef.value),productId:pid,qty:q,value:Number(ev.value)});save();closeModal();show("stock");notify("Entrada registrada.")})}
function globalFind(q){if(q.length<2)return;let c=s.clients.find(x=>x.name.toLowerCase().includes(q.toLowerCase()));if(c){show("clients");renderClients(q);return}let o=s.orders.find(x=>String(x.id).includes(q));if(o)openOrder(o.id)}
function openModal(title,body,ok,okText="Salvar"){$("modal").innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="mh"><b>${title}</b><button class="mini" onclick="closeModal()">✕</button></div><div class="mb">${body}</div><div class="mf"><button class="btn ghost" onclick="closeModal()">Cancelar</button>${ok?`<button id="mok" class="btn primary">${okText}</button>`:""}</div></div></div>`;if(ok)$("mok").onclick=ok}
function closeModal(){$("modal").innerHTML=""}
function reset(){if(confirm("Restaurar os dados de demonstração?")){s=cp(base);save();show("home")}}
function renderAll(){renderHome();renderClients();renderOrders();renderProducts();renderServices();renderTechs();renderSuppliers();renderStock();if(orderId&&$("p-detail").classList.contains("active"))renderDetail()}
</script>
</body></html>
